# Four services, two front-ends onto the SAME app image, so wrk hits an identical app two ways:
#   http://127.0.0.1:8081/  -> nginx-rr    -FastCGI->  app-rr    (rr serve)
#   http://127.0.0.1:8091/  -> nginx-rapira -HTTP proxy-> app-rapira (rapira serve)
#
# Two extra host ports expose each server's own HTTP listener WITHOUT nginx, for
# direct-throughput benchmarks (see README "Direct (no-nginx) benchmarks"):
#   http://127.0.0.1:8080/  -> app-rr     RR http plugin (added via -o; :9000 fcgi stays)
#   http://127.0.0.1:8000/  -> app-rapira Rapira's own HTTP server
#
# Two alternative front-ends proxy the SAME app-rapira:8000 upstream nginx-rapira uses, so only
# the proxy differs (modern Go proxies vs nginx — see README "Proxy comparison"):
#   http://127.0.0.1:8092/  -> caddy-rapira   Caddy    (Go)
#   http://127.0.0.1:8093/  -> traefik-rapira Traefik  (Go)

services:
    app-rr:
        build:
            context: .
        image: rr-vs-rapira-repro:app
        # -o adds an HTTP listener on :8080 alongside the :9000 fcgi listener, from the
        # byte-verbatim .rr.yaml, so nginx-rr keeps using fcgi while wrk can hit RR directly.
        command: ["rr", "serve", "-c", ".rr.yaml", "-o", "http.address=0.0.0.0:8080"]
        expose:
            - "9000"
            - "8080"
        ports:
            - "127.0.0.1:8080:8080"
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 30s

    nginx-rr:
        image: nginx:1.27-alpine
        depends_on:
            app-rr:
                condition: service_healthy
        volumes:
            - ./docker/nginx/rr.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "127.0.0.1:8081:80"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    app-rapira:
        # Same image as app-rr — built once, reused (no second build context).
        image: rr-vs-rapira-repro:app
        build:
            context: .
        command: ["rapira", "serve", "--config", "rapira.toml"]
        expose:
            - "8000"
        # Publish the same HTTP listener nginx-rapira proxies to, so wrk can hit Rapira directly.
        ports:
            - "127.0.0.1:8000:8000"
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 30s

    nginx-rapira:
        image: nginx:1.27-alpine
        depends_on:
            app-rapira:
                condition: service_healthy
        volumes:
            - ./docker/nginx/rapira.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "127.0.0.1:8091:80"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    # Alternative proxies onto the same app-rapira:8000 upstream. Both pool keepalive upstream
    # connections and DNS-resolve the backend by default — the knob nginx's bare proxy_pass lacked.
    caddy-rapira:
        image: caddy:2-alpine
        depends_on:
            app-rapira:
                condition: service_healthy
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        ports:
            - "127.0.0.1:8092:80"

    traefik-rapira:
        image: traefik:v3.3
        depends_on:
            app-rapira:
                condition: service_healthy
        volumes:
            - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
            - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
        ports:
            - "127.0.0.1:8093:80"
