# Rapira front-end: nginx reverse-proxies HTTP to the Rapira app container on :8000, exactly like
# current sylius prod (see .docker/nginx/prod.conf.template on master). The X-Forwarded-* headers
# stand in for the FastCGI HTTPS param; framework.yaml trusts the private Docker ranges so Symfony
# honours the forwarded scheme.
upstream rapira_app {
    server app-rapira:8000;
    # Reuse upstream connections instead of a fresh TCP handshake per request. A bare proxy_pass
    # opens (and then TIME_WAITs) one connection per request, which pins nginx near 7 CPU cores
    # under load; keepalive drops that well below one core. Even nginx's newer default keepalive
    # (on by default since 1.29.7) applies only to an explicit upstream{} block like this one, never
    # to a bare proxy_pass target — so bumping the image alone would not fix a bare proxy_pass.
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://rapira_app;
        proxy_http_version 1.1;
        # Clear the hop-by-hop Connection header so nginx keeps the upstream socket alive
        # instead of sending "Connection: close" and defeating the keepalive above.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60;
        # The /render body (~32 KB) overflows nginx's ~32k aggregate default proxy buffers (8 x 4k);
        # size them like rr.conf's fastcgi buffers so the response is not spooled through a temp file.
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    error_log /dev/stderr;
    access_log /dev/stdout combined buffer=64k flush=5s;
}
