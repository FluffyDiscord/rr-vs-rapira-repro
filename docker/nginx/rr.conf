# RoadRunner front-end: nginx speaks FastCGI to the RR app container on :9000, exactly like
# the old sylius prod (see .docker/nginx/prod.conf.template at commit 7bcc50f^). SCRIPT_FILENAME
# is the path INSIDE the RR container — nginx holds none of the app files, it only forwards.
server {
    listen 80 default_server;
    server_name _;

    location / {
        include fastcgi_params;
        fastcgi_pass app-rr:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /usr/src/myapp/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /usr/src/myapp/public;
        # The real edge terminates TLS and the app always serves HTTPS; restate it here as the
        # FastCGI HTTPS param (the reverse-proxy X-Forwarded-Proto has no equivalent over FastCGI).
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
    }

    error_log /dev/stderr;
    access_log /dev/stdout combined buffer=64k flush=5s;
}
