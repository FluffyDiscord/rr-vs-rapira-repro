[PHP]
date.timezone=UTC
; Each Rapira dispatcher worker is an independent resident PHP process, so this is per worker
; and, with no pool recycling configured, it is also the de facto ceiling a leaking worker hits.
; Provisional — set from measurement.
memory_limit=384M
serialize_precision=-1
zend.detect_unicode=0
upload_max_filesize=16M
post_max_size=20M

display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

expose_php=Off
allow_url_include=Off
zend.exception_ignore_args=Off

realpath_cache_size=4096K
realpath_cache_ttl=3600

[opcache]
opcache.enable=1
opcache.enable_cli=1
; Per worker, not one shared FPM-master segment. Provisional — verify against
; opcache_get_status()['cache_full'] before finalising.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
; opcache.preload is deliberately absent: it amortized class loading across short-lived
; requests, which a worker that boots the kernel once no longer needs — and it would now
; cost its full memory footprint in every worker instead of once in the FPM master.
; JIT disabled: PHP 8.5's function JIT segfaults deterministically on the product-list (PLP)
; path once a long-lived resident worker warms it past jit_hot_func=127, killing the worker with
; SIGSEGV and no PHP fatal (an empty 500 at the edge). It only surfaces under worker mode: fpm's
; per-request processes never reached the hot threshold. JIT gives negligible gain on this
; Twig/Doctrine/object-graph workload; re-enable only after a PHP point release fixes the crash.
opcache.jit=disable
opcache.jit_buffer_size=0

[ffi]
ffi.enable=true
